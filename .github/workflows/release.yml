name: Build & Release Veo Farm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # electron-builder needs Windows binaries (7zip-bin, app-builder-bin,
      # winCodeSign). Verify the 2 most-frequently-skipped ones — if pnpm
      # missed them despite supportedArchitectures, fail fast with a clear msg.
      - name: Verify electron-builder Windows binaries
        shell: pwsh
        run: |
          $needed = @(
            "node_modules/7zip-bin/win/x64/7za.exe",
            "node_modules/app-builder-bin/win/x64/app-builder.exe"
          )
          foreach ($p in $needed) {
            if (-not (Test-Path $p)) {
              throw "Missing: $p — pnpm did not install Windows binary."
            }
          }
          Write-Host "All required Windows binaries present."

      - name: Download ffmpeg static (Windows x64)
        shell: pwsh
        run: |
          $ffmpegDir = "apps/desktop/vendor/ffmpeg"
          New-Item -ItemType Directory -Force -Path $ffmpegDir | Out-Null
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile "$ffmpegDir/ffmpeg.zip"
          Expand-Archive -Path "$ffmpegDir/ffmpeg.zip" -DestinationPath "$ffmpegDir/_unpack"
          Copy-Item "$ffmpegDir/_unpack/*/bin/ffmpeg.exe" -Destination "$ffmpegDir/ffmpeg.exe"
          Remove-Item -Recurse -Force "$ffmpegDir/_unpack","$ffmpegDir/ffmpeg.zip"

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm --filter @veo-farm/desktop build

      # electron-builder + pnpm hoist sometimes leaves binary deps unreachable
      # via spawn(). Re-install electron-builder's own deps inside the desktop
      # workspace using npm — that gives the packer its own flat node_modules
      # with executable permissions intact.
      - name: Install electron-builder app deps
        shell: pwsh
        working-directory: apps/desktop
        run: |
          npm install --no-package-lock --no-save electron-builder@24.13.3 7zip-bin@^5.2.0 app-builder-bin@^4.0.0

      - name: Package & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/desktop
        run: npx electron-builder --win --x64 --publish always
