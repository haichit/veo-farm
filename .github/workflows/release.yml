name: Build & Release Veo Farm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # electron-builder needs 7zip-bin/win/x64/7za.exe at pack time. pnpm
      # sometimes skips the optional binary even on Windows runners, so verify
      # + reinstall it explicitly.
      - name: Ensure 7zip-bin Windows binary
        shell: pwsh
        run: |
          $expected = "node_modules/7zip-bin/win/x64/7za.exe"
          if (-not (Test-Path $expected)) {
            Write-Host "7za.exe missing — forcing reinstall of 7zip-bin"
            pnpm add -w 7zip-bin --no-save
          }
          if (-not (Test-Path $expected)) {
            throw "7zip-bin still missing at $expected"
          }

      - name: Download ffmpeg static (Windows x64)
        shell: pwsh
        run: |
          $ffmpegDir = "apps/desktop/vendor/ffmpeg"
          New-Item -ItemType Directory -Force -Path $ffmpegDir | Out-Null
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile "$ffmpegDir/ffmpeg.zip"
          Expand-Archive -Path "$ffmpegDir/ffmpeg.zip" -DestinationPath "$ffmpegDir/_unpack"
          Copy-Item "$ffmpegDir/_unpack/*/bin/ffmpeg.exe" -Destination "$ffmpegDir/ffmpeg.exe"
          Remove-Item -Recurse -Force "$ffmpegDir/_unpack","$ffmpegDir/ffmpeg.zip"

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm --filter @veo-farm/desktop build

      - name: Package & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @veo-farm/desktop dist
