packages:
  - 'apps/*'
  - 'packages/*'

# electron-builder ships platform-specific binaries (7zip-bin, app-builder-bin,
# winCodeSign, ...) as optional deps — pnpm normally only fetches the slice
# matching the current platform. Listing every target here forces pnpm to
# download the Windows-x64 binaries even when CI happens to run elsewhere.
supportedArchitectures:
  os:
    - win32
    - darwin
    - linux
  cpu:
    - x64
    - arm64
